<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>
      Scale Hub | Tráfego pago para negócios locais
    </title>

    <meta
      name="description"
      content="Estratégia, campanhas, páginas e mensuração para transformar anúncios em oportunidades comerciais."
    />

    <meta name="theme-color" content="#05080d" />

    <!-- URL oficial -->
    <link
      rel="canonical"
      href="https://scalehub-lp-puce.vercel.app/"
    />

    <!-- Open Graph: WhatsApp, Facebook, LinkedIn e outros -->
    <meta property="og:type" content="website" />

    <meta
      property="og:locale"
      content="pt_BR"
    />

    <meta
      property="og:site_name"
      content="Scale Hub"
    />

    <meta
      property="og:url"
      content="https://scalehub-lp-puce.vercel.app/"
    />

    <meta
      property="og:title"
      content="Scale Hub | Tráfego pago para negócios locais"
    />

    <meta
      property="og:description"
      content="Transformamos anúncios em conversas reais com pessoas interessadas no que sua empresa oferece."
    />

    <meta
      property="og:image"
      content="https://scalehub-lp-puce.vercel.app/logo-scalehub.png"
    />

    <meta
      property="og:image:secure_url"
      content="https://scalehub-lp-puce.vercel.app/logo-scalehub.png"
    />

    <meta
      property="og:image:type"
      content="image/png"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="Scale Hub — tráfego pago para negócios locais"
    />

    <!-- Twitter/X e plataformas compatíveis -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Scale Hub | Tráfego pago para negócios locais"
    />

    <meta
      name="twitter:description"
      content="Transformamos anúncios em conversas reais com pessoas interessadas no que sua empresa oferece."
    />

    <meta
      name="twitter:image"
      content="https://scalehub-lp-puce.vercel.app/logo-scalehub.png"
    />

    <!-- Ícone da aba -->
    <link
      rel="icon"
      type="image/png"
      href="/logo-scalehub.png"
    />

    <!-- Google Analytics -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-KWNY0D6YGR"
    ></script>

    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        dataLayer.push(arguments);
      }

      gtag("js", new Date());
      gtag("config", "G-KWNY0D6YGR");
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
